[project]
name = "calculadora-re"
version = "0.1.0"
description = "Reimplementação da Calculadora do Windows 11.2607.0.0 a partir da engenharia reversa documentada (Fase 5)"
requires-python = ">=3.10"
dependencies = ["mpmath>=1.3"]

[project.optional-dependencies]
testes = ["pytest>=8"]

[project.scripts]
calculadora = "calculadora.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Só o pacote; `ferramentas/` e `tests/` ficam fora da distribuição (a autodescoberta em layout plano abortava).
packages = ["calculadora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
